# One command to run the whole stack on a Vultr VM.
#   docker build -t sandbox-runner:latest ./sandbox   # build the sandbox image first
#   docker compose up --build -d
services:
  backend:
    build: ./backend
    env_file: .env
    ports:
      # Loopback only: the public entry point is nginx on :8080, which proxies
      # /api over the compose network. Keeps the API off the open internet.
      - "127.0.0.1:8000:8000"
    volumes:
      # The orchestrator launches sandbox containers via the host Docker daemon.
      # NOTE: socket access is root-equivalent on the host; see docs/ARCHITECTURE.md.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
