# Per-IP throttle on agent runs: each run costs a container and LLM credits.
# (This file is included inside nginx's http{} block, so the zone is valid here.)
limit_req_zone $binary_remote_addr zone=agent_runs:10m rate=6r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tasks are capped at a few KB by the API; reject anything larger early.
    client_max_body_size 64k;

    location / {
        try_files $uri /index.html;
    }

    location = /api/run {
        limit_req zone=agent_runs burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        # Keep SSE streaming unbuffered.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
